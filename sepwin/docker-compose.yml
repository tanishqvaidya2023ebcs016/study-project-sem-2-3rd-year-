services:
  redis:
    image: redis:7-alpine
    container_name: local-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      # Match the filename to what is actually on your Windows machine
      - ./redis.config:/usr/local/etc/redis/redis.conf 
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  queue-server:
    build:
      context: .
      dockerfile: dev.dockerfile
    container_name: local-queue-server
    ports:
      - "50051:50051"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GRPC_PORT=50051
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Checks if the gRPC port is open before allowing other services to connect
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: python grpc_queue_server.py
    restart: unless-stopped

  file-server:
    build:
      context: .
      dockerfile: dev.dockerfile
    container_name: local-file-server
    ports:
      - "50052:50052"
    environment:
      - OUTPUT_FILE=/app/output/links.txt
      - GRPC_PORT=50052
    volumes:
      - ./output:/app/output
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50052 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: python grpc_file_server.py
    restart: unless-stopped

  crawler:
    build:
      context: .
      dockerfile: dev.dockerfile
    container_name: local-crawler
    environment:
      - QUEUE_SERVER=queue-server:50051
      - FILE_SERVER=file-server:50052
      - CRAWLER_ID=crawler-Windows
      - MAX_URLS=200
      - SEED_URLS=true
    depends_on:
      queue-server:
        condition: service_healthy
      file-server:
        condition: service_healthy
    command: python crawler.py
    restart: unless-stopped

volumes:
  redis_data: